name: Build KUROMH Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Publish as Beta pre-release or Stable release"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Check Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] ||
             [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets belum lengkap!"
            exit 1
          fi

      - name: Read APK Version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)

          if [ -z "$VERSION" ]; then
            echo "::error::versionName tidak ditemukan!"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --console=plain

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          trap 'rm -f release.keystore' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          chmod 600 release.keystore

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned APK tidak ditemukan. Periksa signingConfig release di build.gradle.kts."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "KUROMH-v${VERSION}-Release.apk" \
            "$UNSIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            --print-certs \
            "KUROMH-v${VERSION}-Release.apk"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KUROMH-Release-APK
          path: KUROMH-v${{ env.VERSION }}-Release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'beta' }}
        run: |
          TAG="v${VERSION}-build${{ github.run_number }}-attempt${{ github.run_attempt }}"
          EXTRA_ARGS=()
          if [ "$RELEASE_CHANNEL" != "stable" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            "KUROMH-v${VERSION}-Release.apk" \
            --title "KUROMH $TAG" \
            --generate-notes \
            --target "${{ github.sha }}" \
            "${EXTRA_ARGS[@]}"
