name: Build KUROMH Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk membuat GitHub Release

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Pin Gradle 8.2 (sesuai AGP 8.2.0). Tidak perlu gradle wrapper.
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --console=plain

      # Opsional: isi secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS
      # supaya tanda tangan APK selalu sama (bisa update tanpa uninstall).
      # Jika kosong, keystore baru dibuat tiap build.
      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'kuromh123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kuromh_alias' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KUROMH, OU=KUROMH, O=KUROMH, C=ID" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD"
          fi
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out KUROMH-v1.0-Release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify KUROMH-v1.0-Release.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KUROMH-Release-APK
          path: KUROMH-v1.0-Release.apk

      # Buat GitHub Release otomatis (tag unik per build) dan lampirkan APK-nya
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-build${{ github.run_number }}"
          gh release create "$TAG" KUROMH-v1.0-Release.apk \
            --title "KUROMH $TAG" \
            --notes "Automated build dari commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
