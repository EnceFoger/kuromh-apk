name: Build KUROMH Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias kuromh_alias -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KUROMH, OU=KUROMH, O=KUROMH, C=ID" -storepass kuromh123 -keypass kuromh123
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-key-alias kuromh_alias --ks-pass pass:kuromh123 --key-pass pass:kuromh123 --out KUROMH-v1.0-Release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KUROMH-Release-APK
          path: KUROMH-v1.0-Release.apk
